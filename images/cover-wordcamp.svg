  <path d="M0 512c60-26 120-40 190-30 70 10 120 30 200 34 90 5 200-18 330-34v58H0z" fill="#2F6F55"/>
  <path d="M0 528c90-16 170-22 260-10 90 12 190 22 300 12 60-5 120-12 160-16v26H0z" fill="#26573F"/>

