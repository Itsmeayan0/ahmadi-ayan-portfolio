  <g stroke="#3E8A69" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M470 160c6-6 12-6 18 0M492 154c6-6 12-6 18 0M520 168c6-6 12-6 18 0"/>
