    <path d="M-30 40c0-18 12-26 12-26s12 8 12 26z" fill="#2F6F55"/>
    <rect x="-92" y="76" width="20" height="80" fill="#3E8A69"/>
    <path d="M-92 76c0-12 10-18 10-18s10 6 10 18z" fill="#2F6F55"/>
    <rect x="46" y="76" width="20" height="80" fill="#3E8A69"/>
    <path d="M46 76c0-12 10-18 10-18s10 6 10 18z" fill="#2F6F55"/>
  </g>

  <!-- palms -->
  <g stroke="#2F6F55" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M96 542V452"/>
    <path d="M96 452c-22-6-34-22-36-38M96 452c22-6 34-22 36-38M96 450c-26 6-40 2-52-8M96 450c26 6 40 2 52-8M96 456c-8-20-4-36 4-48"/>
    <path d="M646 542V470"/>
    <path d="M646 470c-18-4-28-18-30-30M646 470c18-4 28-18 30-30M646 468c-20 6-32 4-42-4M646 468c20 6 32 4 42-4"/>
