<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF3D2"/>
      <stop offset="0.62" stop-color="#FBEFC0"/>
      <stop offset="1" stop-color="#F7E7AE"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E9C7A"/>
      <stop offset="1" stop-color="#2F6F55"/>
    </linearGradient>
    <linearGradient id="city2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB894"/>
      <stop offset="1" stop-color="#3E8A69"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="url(#sky)"/>

  <!-- badge -->
  <g transform="translate(360 74)">
    <circle r="26" fill="#fff" stroke="#2F6F55" stroke-width="2"/>
    <path d="M-9 6c0-8 5-13 9-13s9 5 9 13z" fill="#2F6F55"/>
    <circle cy="-13" r="4" fill="#2F6F55"/>
    <text y="34" text-anchor="middle" font-family="Georgia,serif" font-size="15" letter-spacing="6" fill="#2F6F55">WORDCAMP</text>
    <text y="52" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#B4553C">Sylhet 2026</text>
  </g>

  <!-- photo circles -->
  <g>
    <circle cx="112" cy="248" r="52" fill="#C9D8C2" stroke="#fff" stroke-width="4"/>
    <circle cx="236" cy="248" r="52" fill="#B9C6AE" stroke="#fff" stroke-width="4"/>
    <circle cx="360" cy="248" r="52" fill="#8E9A86" stroke="#fff" stroke-width="4"/>
    <circle cx="484" cy="248" r="52" fill="#C4CFBB" stroke="#fff" stroke-width="4"/>
    <circle cx="608" cy="248" r="52" fill="#CBD9C3" stroke="#fff" stroke-width="4"/>
    <g fill="#6F7F68" opacity="0.55">
      <circle cx="112" cy="232" r="15"/><path d="M84 286c4-22 18-28 28-28s24 6 28 28z"/>
      <circle cx="236" cy="232" r="15"/><path d="M208 286c4-22 18-28 28-28s24 6 28 28z"/>
      <circle cx="360" cy="232" r="15"/><path d="M332 286c4-22 18-28 28-28s24 6 28 28z"/>
      <circle cx="484" cy="232" r="15"/><path d="M456 286c4-22 18-28 28-28s24 6 28 28z"/>
      <circle cx="608" cy="232" r="15"/><path d="M580 286c4-22 18-28 28-28s24 6 28 28z"/>
    </g>
  </g>

  <!-- skyline back -->
  <path d="M0 400h34v-46h26v46h20v-70h30v70h18v-34h22v34h26v-58h34v58h20v-40h26v40h34v-64h24v64h30v-30h22v30h28v-52h26v52h30v-38h24v38h26v-60h28v60h22v-26h24v26h24v-46h26v46h20v140H0z" fill="url(#city2)" opacity="0.85"/>

  <!-- bridge -->
  <g stroke="#2F6F55" stroke-width="5" fill="none">
    <path d="M40 470c90-58 180-58 270 0"/>
    <path d="M40 470h270"/>
    <path d="M70 470l30-26M130 470l0-38M190 470l0-38M250 470l30-26"/>
  </g>

  <!-- clock tower -->
  <g transform="translate(330 330)">
    <rect x="-26" y="10" width="52" height="130" fill="url(#city)"/>
    <rect x="-18" y="-18" width="36" height="30" fill="url(#city)"/>
    <path d="M-24 -16l24-34 24 34z" fill="#2F6F55"/>
    <circle cy="34" r="16" fill="#F4EBC9" stroke="#2F6F55" stroke-width="3"/>
